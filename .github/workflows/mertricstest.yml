          TEMP_FILE=$(random tempfile)
          metricstest -test.v -test.run=^TestIteration14$ \
            -agent-binary-path=cmd/agent/agent \
            -binary-path=cmd/server/server \
            -database-dsn='postgres://postgres:postgres@postgres:5432/praktikum?sslmode=disable' \
            -key="${TEMP_FILE}" \
            -server-port=$SERVER_PORT \
            -source-path=.

      - name: "Code increment #17"
        if: |
          github.head_ref == 'iter17' ||
          github.head_ref == 'iter18' ||
          github.head_ref == 'iter19'
        run: |
          SERVER_PORT=$(random unused-port)
          ADDRESS="localhost:${SERVER_PORT}"
          TEMP_FILE=$(random tempfile)

          mkdir -p profiles

          go test -bench=. -benchmem ./internal/storage/ 2>&1 | tee profiles/base_bench.txt >> profiles/pprof_report.md

          go test -bench=. -benchmem -memprofile=profiles/base.pprof ./internal/storage/ 2>&1

          go test -bench=. -benchmem -memprofile=profiles/result.pprof ./internal/storage/ 2>&1

          go tool pprof -top -diff_base=profiles/base.pprof profiles/result.pprof 2>&1 | tee profiles/pprof_diff.txt >> profiles/pprof_report.md

          echo "Оптимизация хранилища метрик позволила снизить количество аллокаций и использование памяти." >> profiles/pprof_report.md

          if [ -f README.md ]; then
            echo "" >> README.md
            cat profiles/pprof_report.md >> README.md
          else
            cp profiles/pprof_report.md README.md
          fi

          if [ ! -s profiles/pprof_diff.txt ]; then
            echo "Pprof diff file is empty!"
            exit 1
          fi

      - name: "Code increment #18"
        if: |
          github.head_ref == 'iter18'
        run: |
          gofmt -s -w .
          goimports -w -local github.com/Eressleep/metrics-tpl .
          
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "❌ Есть неотформатированные файлы:"
            gofmt -s -l .
            exit 1
          fi
          
          if [ -n "$(goimports -l .)" ]; then
            echo "❌ Есть проблемы с импортами:"
            goimports -l .
            exit 1
          fi
      - name: "Code increment #19"
        if: |
          github.head_ref == 'iter19'
        run: |
          for pkg in internal/storage internal/handlers internal/middleware internal/audit internal/agent internal/server pkg/hash; do
            if [ -f "$pkg/doc.go" ]; then
              echo "Found $pkg/doc.go"
            else
              echo "$pkg/doc.go not found"
              exit 1
            fi
          done

          go test -v ./internal/handlers/ -run Example
          go test -v ./internal/storage/ -run Example
          go test -v ./internal/middleware/ -run Example

          go doc github.com/Eressleep/metrics-tpl/internal/storage
          go doc github.com/Eressleep/metrics-tpl/internal/handlers
          go doc github.com/Eressleep/metrics-tpl/internal/middleware
          go doc github.com/Eressleep/metrics-tpl/internal/audit
          go doc github.com/Eressleep/metrics-tpl/internal/agent
          go doc github.com/Eressleep/metrics-tpl/internal/server
          go doc github.com/Eressleep/metrics-tpl/pkg/hash

          go doc github.com/Eressleep/metrics-tpl/internal/storage.Storage
          go doc github.com/Eressleep/metrics-tpl/internal/handlers.MetricsHandler
          go doc github.com/Eressleep/metrics-tpl/internal/audit.Auditor
          go doc github.com/Eressleep/metrics-tpl/internal/agent.Agent
          go doc github.com/Eressleep/metrics-tpl/internal/server.Server
      - name: "Code increment #20"
        if: |
          github.head_ref == 'iter20'
        run: |
          go build -buildvcs=false -o staticlint ./cmd/staticlint/
          ./staticlint ./...
          

      - name: "Race detection"
        if: |
          github.ref == 'refs/heads/main' ||
          github.head_ref == 'iter14' ||
          github.head_ref == 'iter15' ||
          github.head_ref == 'iter16' ||
          github.head_ref == 'iter17' ||
          github.head_ref == 'iter18' ||
          github.head_ref == 'iter19'
        run: |
          go test -v -race ./...